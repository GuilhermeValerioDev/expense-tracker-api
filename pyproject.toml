[project]
name = "expense-tracker-api"
version = "0.1.0"
description = "A RESTful Expense Tracker API built with FastAPI, SQLAlchemy and PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.137.1,<1.0.0",
    "uvicorn>=0.49.0,<1.0.0",
    "sqlalchemy>=2.0.51,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pwdlib[argon2]>=0.3.0,<1.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
    "python-multipart>=0.0.32,<1.0.0",
    "pydantic-settings>=2.6,<3.0",
    "email-validator>=2.2,<3.0",
    "alembic>=1.14,<2.0",
    "slowapi>=0.1.9,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0",
    "httpx2>=2.16.0",
]

[tool.uv]
# This is an application, not a distributable library: do not build/install it.
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]
# B008: FastAPI declares dependencies as function-call defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
